name: Checkout

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
      - "develop"
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
      - "support/**"
    paths:
      - "pubspec.yaml"
      - "pubspec.lock"
      - "lib/**.dart"
      - "test/**.dart"
      - "example/**.dart"

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  checkout:
    name: "🧪 Check code with analysis, format, and tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./
    steps:
      - name: 📦 Get the .github actions
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github

      - name: 🚂 Setup Flutter and dependencies
        uses: ./.github/actions/setup
        with:
          flutter-version: 3.38.0

      - name: 👷 Install Dependencies
        timeout-minutes: 2
        run: |
          flutter pub get
          flutter pub get --directory example

      - name: 🚦 Check code format
        id: check-format
        timeout-minutes: 1
        run: |
          find lib test example/lib example/test -name "*.dart" ! -name "*.*.dart" -print0 | xargs -0 dart format --set-exit-if-changed -o none

      - name: 🔍 Check what would be published
        id: check-published-files
        timeout-minutes: 2
        # A .pubignore replaces the .gitignore of its own directory for
        # `pub publish`, so a rule forgotten there uploads credentials or
        # build output to pub.dev. This is the last line of defence.
        run: |
          flutter pub publish --dry-run > /tmp/publish-set.txt 2>&1 || true
          sed -E 's/.*[├└]── //; s/ \([^)]*\)$//' /tmp/publish-set.txt |
            grep -iE '^([^ ]+\.(key|pem|p12|jks|keystore)|[^ ]+\.vm\.json|credentials\.json|service-account[^ ]*\.json|build|coverage|reports|node_modules)$' \
            > /tmp/leaked.txt || true
          if [ -s /tmp/leaked.txt ]; then
            echo "::error::Files that must never reach pub.dev are in the published set:"
            cat /tmp/leaked.txt
            echo "Add them to .pubignore - it replaces .gitignore for pub."
            exit 1
          fi
          echo "The published file set is clean."

      - name: 📈 Check for Warnings
        id: check-analyzer
        timeout-minutes: 2
        run: |
          flutter analyze --fatal-infos --fatal-warnings lib/ test/
          flutter analyze --fatal-infos --fatal-warnings example/

      - name: 📚 Check the documentation
        id: check-documentation
        timeout-minutes: 2
        run: |
          dart doc --dry-run

      - name: 🧪 Unit & Widget tests
        timeout-minutes: 5
        run: |
          flutter test -r github --concurrency=6 --coverage test/squid_test.dart

      - name: 🧪 Example tests
        timeout-minutes: 5
        working-directory: ./example
        run: |
          flutter test -r github --concurrency=6

      - name: 📥 Upload coverage to Codecov
        timeout-minutes: 2
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: 📥 Upload test report
        uses: actions/upload-artifact@v4
        if: ${{ (success() || failure()) && github.actor != 'dependabot[bot]' }}
        with:
          name: test-results
          path: reports/tests.json

      - name: 📤 Check the package before publishing
        id: check-publish
        timeout-minutes: 2
        run: |
          flutter pub publish --dry-run
